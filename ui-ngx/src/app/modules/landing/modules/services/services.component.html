<!-- services.component.html -->
<section servicesSection id="services" class="services">
    <div class="container">
        <div class="section-header fade-in-up">
            <h2 class="section-title">Our Services</h2>
            <p class="section-description">
                Comprehensive IoT solutions tailored for cultural heritage preservation
            </p>
        </div>

        <div class="services-grid">
            <div *ngFor="let service of services; let i = index" class="service-card fade-in-up"
                [style.animation-delay]="i * 0.2 + 's'">
                <div class="service-header">
                    <h3 class="service-title">{{service.title}}</h3>
                    <p class="service-description">{{service.description}}</p>
                </div>
                <ul class="service-features">
                    <li *ngFor="let feature of service.features" class="service-feature">
                        <span class="feature-icon">✓</span>
                        {{feature}}
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
