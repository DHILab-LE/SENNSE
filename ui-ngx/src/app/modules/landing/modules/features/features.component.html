<!-- features.component.html -->
<section #featuresSection id="features" class="features">
    <div class="container">
        <div class="section-header fade-in-up">
            <h2 class="section-title">Smart Features for Heritage Preservation</h2>
            <p class="section-description">
                Discover how our IoT solutions revolutionize cultural heritage management
            </p>
        </div>

        <div class="features-grid">
            <div *ngFor="let feature of features; let i = index" class="feature-card fade-in-up"
                [style.animation-delay]="i * 0.1 + 's'">
                <div class="feature-icon">{{feature.icon}}</div>
                <h3 class="feature-title">{{feature.title}}</h3>
                <p class="feature-description">{{feature.description}}</p>
            </div>
        </div>
    </div>
</section>
