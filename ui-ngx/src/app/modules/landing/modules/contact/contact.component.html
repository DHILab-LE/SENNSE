<!-- contact.component.html -->
<section #contactSection id="contact" class="contact">
    <div class="container">
        <div class="contact-content">
            <div class="contact-info fade-in-up">
                <h2 class="contact-title">Get in Touch</h2>
                <p class="contact-description">
                    Ready to protect your cultural heritage with smart IoT solutions?
                    Let's discuss how we can help preserve your valuable assets.
                </p>

                <div class="contact-details">
                    <div class="contact-item">
                        <div class="contact-icon">📧</div>
                        <div>
                            <h4>Email</h4>
                            <p>info&#64;sennse.cnr.it</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">📞</div>
                        <div>
                            <h4>Phone</h4>
                            <p>+39 083-242-2200</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">📍</div>
                        <div>
                            <h4>Address</h4>
                            <p>Strada prov.le Lecce-Monteroni,<br /> 73100 Lecce LE</p>
                        </div>
                    </div>
                </div>
            </div>

            <form class="contact-form fade-in-up" (ngSubmit)="submitForm()" #contactForm="ngForm">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" [(ngModel)]="formData.name" required />
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" [(ngModel)]="formData.email" required />
                </div>

                <div class="form-group">
                    <input type="text" name="organization" placeholder="Organization (Optional)"
                        [(ngModel)]="formData.organization" />
                </div>

                <div class="form-group">
                    <textarea name="message" placeholder="Your Message" rows="5" [(ngModel)]="formData.message"
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>
    </div>
</section>
