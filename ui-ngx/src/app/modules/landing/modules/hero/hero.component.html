<!-- superHero.component.html -->
<section #heroSection id="home" class="superHero">
    <div class="superHero-background">
        <div class="superHero-particles"></div>
    </div>

    <div class="containerHero">
        <div class="superHero-content">
            <div class="superHero-text fade-in-up">
                <h1 class="superHero-title">
                    Preserving Heritage Through
                    <span class="gradient-text"> Smart Technology</span>
                </h1>
                <p class="superHero-description">
                    Connect cultural heritage sites with cutting-edge IoT solutions.
                    Monitor, protect, and share our precious cultural assets with the world
                    through intelligent sensors and real-time data analytics.
                </p>
                <div class="superHero-buttons">
                    <button class="btn-primary" (click)="goToLoginPage()">
                        Sign in
                    </button>
                    <button class="btn-secondary" (click)="watchDemoButton()">
                        Watch Demo
                    </button>
                </div>
            </div>

            <div class="superHero-visual float">
                <div class="heritage-icon">
                    <div class="icon-circle pulse">
                        <span class="icon">🏛️</span>
                    </div>
                    <div class="iot-nodes">
                        <div class="node node-1">📡</div>
                        <div class="node node-2">🌡️</div>
                        <div class="node node-3">💡</div>
                        <div class="node node-4">📊</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
