<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
<div class="container mx-auto mt-10 grid grid-cols-2 gap-4 relative">
    <!-- Board Management Section -->
    <div id="board-container" class="bg-gray-100 p-6 max-w-2xl mx-auto rounded-lg border shadow-md mt-10">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-700">New Network</h3>
        </div>
        <div class="space-y-4">
            <!-- WSN Name Input -->
            <div>
                <label for="wsnName" class="text-sm font-medium text-gray-700">WSN Name*</label>
                <input type="text" id="wsnName" [(ngModel)]="wsnName" class="w-full p-2 border rounded text-sm"
                    placeholder="Enter WSN Name" disabled />
                <p id="wsnNameError" class="text-red-500 text-xs hidden">WSN Name is required.</p>
            </div>
        </div>

        <!-- Add New Device Button -->
        <button (click)="addNewBoard()" class="text-blue-500 text-sm mt-2">Add New Device</button>

        <!-- Boards Section -->
        <div *ngFor="let board of boards" [id]="board.id" class="bg-gray-100 p-4 mt-4 rounded-lg border">
            <!-- Board Name Input -->
            <div>
                <label for="{{board.id}}-name" class="text-sm font-medium text-gray-700">Device (Node)*</label>
                <input type="text" [(ngModel)]="board.name" id="{{board.id}}-name"
                    class="w-full p-2 border rounded text-sm" placeholder="Enter Device (Node) Name" />
            </div>

            <!-- Sensors Section -->
            <div id="{{board.id}}-sensor-section" class="mt-4">
                <div *ngFor="let sensor of board.sensors; let i = index" class="mt-4 flex items-center space-x-4">
                    <!-- Telemetry Dropdown -->
                    <select [(ngModel)]="sensor.name" class="w-full p-2 border rounded text-sm"
                        (change)="updateSelectedTelemetryList(board)" [id]="'sensorList-' + board.id + '-' + i">
                        <option value="">Select Sensor</option>
                        <optgroup *ngFor="let category of telemetryCategories | keyvalue" [label]="category.key">
                            <option *ngFor="let telemetry of category.value" [value]="telemetry">{{ telemetry }}
                            </option>
                        </optgroup>
                    </select>

                    <!-- Delete Sensor Button -->
                    <button class="text-red-500 text-sm ml-2" (click)="deleteSensor(board, i)">Delete</button>
                </div>
            </div>

            <!-- Add Sensor Button -->
            <div class="mt-4">
                <button class="text-blue-500 text-sm mt-2" (click)="addSensorDropdown(board)">Add Sensor</button>

                <!-- Delete Board Button -->
                <button class="text-red-500 text-sm ml-4 mt-2" (click)="deleteBoard(board.id)">Delete Device</button>
            </div>


            <!-- Selected Telemetry Display -->
            <div id="{{board.id}}-selected-telemetry-list" class="mt-4 text-sm text-gray-700">
                Selected Sensors: {{ board.selectedTelemetry.join(', ') || 'No sensors selected.' }}
            </div>


        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-3 mt-6">
            <button type="button" class="px-4 py-2 bg-white border rounded text-sm" (click)="validateAndCreateGraph()">
                Visualize Graph
            </button>
            <button type="button" class="px-4 py-2 bg-blue-500 text-white rounded text-sm" (click)="addToTBDevice()">
                Add
            </button>
        </div>
    </div>

    <!-- Cytoscape and Device List Section -->
    <div>
        <!-- Cytoscape Graph Container -->
        <div class="bg-gray-100 p-6 max-w-md w-full rounded-lg border shadow-md relative" id="cy"></div>

        <!-- Fullscreen Button -->
        <button (click)="toggleFullscreen()" class="absolute top-2 right-5 text-gray-600 hover:text-gray-800 z-10"
            id="fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4h5M4 4v5m5-5L4 4m16 16h-5m5 0v-5m-5 5l5-5M4 20l5-5M9 20H4m0 0v-5m5 5l-5-5" />
            </svg>
        </button>

        <button (click)="downloadBoardsListAsPDF()"
            class="absolute top-2 right-5 text-gray-600 hover:text-gray-800 z-10" id="downloadList">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 9V4a1 1 0 011-1h10a1 1 0 011 1v5M6 19h12a2 2 0 002-2v-5a2 2 0 00-2-2H6a2 2 0 00-2 2v5a2 2 0 002 2zm0 0v2a1 1 0 001 1h10a1 1 0 001-1v-2H6z" />
            </svg>
        </button>

        <div class="bg-gray-100 p-6 max-w-md w-full rounded-lg border shadow-md relative"
            style="top: 100px; left: 200px;">
            <!-- Boards List Section -->
            <div id="boards-list"></div>

            <!-- Email Section -->
            <div *ngIf="emailSectionVisible" class="bg-gray-100 p-6 max-w-md w-full rounded-lg border shadow-md mt-10">
                <h4 class="text-lg font-semibold text-gray-700 mb-4">
                    Email the Device List
                </h4>
                <form>
                    <div class="mb-4">
                        <label for="emailAddress" class="text-sm font-medium text-gray-700">Recipient Email*</label>
                        <input type="email" id="emailAddress" class="w-full p-2 border rounded text-sm"
                            [(ngModel)]="emailAddress" [ngModelOptions]="{ standalone: true }"/>
                        <!-- Error Message -->
                        <div *ngIf="emailError" class="text-red-500 text-sm mt-1" id="emailError">
                            Please enter a valid email address.
                        </div>
                    </div>
                    <button type="button" (click)="sendEmail()"
                        class="px-4 py-2 bg-blue-500 text-white rounded text-sm">
                        Send Email
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
