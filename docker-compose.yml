# Docker Compose Script for ThingsBoard Community Edition !!!
version: "1.1"
services:
  kafka:
    restart: always
    image: bitnami/kafka:3.5.2
    ports:
      - 9092:9092
      - 9093
      - 9094
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "OUTSIDE://:9092,CONTROLLER://:9093,INSIDE://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "OUTSIDE://localhost:9092,INSIDE://kafka:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INSIDE"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
    volumes:
      - kafka-data:/bitnami
  mytb:
    restart: always
    image: "meddali/sennse:2.1.5"
    depends_on:
      - kafka
    ports:
      - "8082:9090" # HTTP port
      - "1884:1883"
      - "7071:7070"
      - "5690:5688/udp"
    environment:
      #THINGSBOARD_MQTT_PORT: 1884
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9094
      #SSL_ENABLED: "true"  # Enable SSL
      SSL_CREDENTIALS_TYPE: "PEM"
      SSL_PEM_CERT: "/config/server_cert.pem"
      SSL_PEM_KEY: "/config/server_key.pem"
      #SSL_PEM_KEY_PASSWORD: 1234

    volumes:
      - mytb-data-v1:/data
      - mytb-logs-v1:/var/log/thingsboard
      # - .\ssl:/config/certs # Mount the certs directory
      #- ./certs:/config/certs:ro  # Mount the certs directory
      - ./certifications/fullchain.pem:/config/server_cert.pem:ro
      - ./certifications/privkey.pem:/config/server_key.pem:ro
volumes:
  mytb-data-v1:
    external: true
  mytb-logs-v1:
    external: true
  kafka-data:
    driver: local
